id = "shadowfax.scratch"
name = "Herdr Scratch"
version = "0.2.0"
description = "Configurable per-pane persistent scratch popups backed by tmux."
min_herdr_version = "0.7.5"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "toggle-nvim"
title = "Toggle scratch nvim"
description = "Open or hide the persistent nvim popup for the focused pane."
contexts = ["pane"]
command = ["./target/release/herdr-scratch", "toggle", "--scratch", "nvim"]

[[actions]]
id = "toggle-shell"
title = "Toggle scratch shell"
description = "Open or hide the persistent shell popup for the focused pane."
contexts = ["pane"]
command = ["./target/release/herdr-scratch", "toggle", "--scratch", "shell"]

[[panes]]
id = "scratch"
title = "scratch"
placement = "popup"
width = "90%"
height = "95%"
command = ["./target/release/herdr-scratch", "run-popup"]

# The resident worker owns scans and retention; popup processes never wait for
# it. The event hook only ensures liveness after a crash, without doing a scan.
[[startup]]
command = ["./target/release/herdr-scratch", "cleanup-start"]

[[events]]
on = "pane.closed"
command = ["./target/release/herdr-scratch", "cleanup-start"]
