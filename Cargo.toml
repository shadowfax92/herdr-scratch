[package]
name = "herdr-scratch"
version = "0.2.0"
edition = "2021"
description = "Configurable per-pane persistent scratch popups for Herdr"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml_edit = "0.22"
noyalib = "0.0.18"

[lib]
name = "herdr_scratch"
path = "src/lib.rs"

[[bin]]
name = "herdr-scratch"
path = "src/main.rs"
